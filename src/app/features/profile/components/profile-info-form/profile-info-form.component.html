<form class="flex flex-col gap-4" (ngSubmit)="onSubmit()" [formGroup]="form">
  <!-- Full Name -->
  <app-profile-input
    inputId="name"
    [control]="form.controls['name']"
    label="Full Name"
    formControlName="name"
    inputType="text"
    [errors]="[
      { error: 'required', message: '*Full Name is required' },
      {
        error: 'minLength',
        message: '*Invalid Name Format',
      },
      {
        error: 'pattern',
        message: '*Invalid Name Format',
      },
    ]"
  />

  <!-- Email Address -->
  <app-profile-input
    inputId="email"
    [control]="form.controls['email']"
    label="Email Address"
    formControlName="email"
    inputType="email"
    [errors]="[
      { error: 'required', message: '*Email is required' },
      {
        error: 'email',
        message: '*Invalid email address',
      },
    ]"
  />

  <!-- Phone Number -->
  <app-profile-input
    inputId="phone"
    [control]="form.controls['phone']"
    label="Phone Number"
    formControlName="phone"
    inputType="text"
    [errors]="[
      { error: 'required', message: '*Please enter your phone number' },
      { error: 'egyptPhone', message: '*Only Egyptian phone numbers are allowed' },
    ]"
  />

  <!-- Save Button -->
  <button
    class="bg-primary-600 hover:bg-primary-700 mb-8 flex items-center gap-2 self-start rounded-xl px-6 py-3 text-sm font-semibold text-white transition-colors"
  >
    @if (isLoading()) {
      <i class="fa-solid fa-spinner animate-spin"></i>
    }

    <i class="fa-solid fa-lock text-sm"></i>
    Save Changes
  </button>
</form>
