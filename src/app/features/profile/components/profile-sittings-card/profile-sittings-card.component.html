<section class="mt-5 rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">
  <!-- Header -->
  <div class="mb-8 flex items-center gap-4">
    <div
      [class]="iconContainerClass()"
      class="flex h-14 w-14 shrink-0 items-center justify-center rounded-xl"
    >
      <i [class]="iconClass()" class="text-xl"></i>
    </div>
    <div>
      <h3 class="text-secondary-900 text-lg font-bold">{{ title() }}</h3>
      <p class="text-secondary-400 text-sm">{{ text() }}</p>
    </div>
  </div>

  <ng-content />
</section>
