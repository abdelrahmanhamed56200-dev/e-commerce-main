<!-- Wishlist Item Card Skeleton -->
<div class="border-t border-gray-100 p-5">
  <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
    <!-- Product Info -->
    <div class="flex flex-1 items-center gap-4">
      <div class="h-16 w-16 shrink-0 animate-pulse rounded-xl bg-gray-200"></div>
      <div class="flex flex-1 flex-col gap-2">
        <div class="h-4 w-3/4 animate-pulse rounded-md bg-gray-300"></div>
        <div class="h-4 w-1/2 animate-pulse rounded-md bg-gray-300"></div>
        <div class="h-3 w-24 animate-pulse rounded-md bg-gray-200"></div>
      </div>
    </div>

    <!-- Price -->
    <div class="flex flex-col gap-1.5 md:px-5">
      <div class="h-4 w-20 animate-pulse rounded-md bg-gray-300"></div>
      <div class="h-3 w-16 animate-pulse rounded-md bg-gray-200"></div>
    </div>

    <!-- Status -->
    <div class="md:px-5">
      <div class="h-6 w-20 animate-pulse rounded-full bg-gray-200"></div>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2 md:w-48">
      <div class="h-9 flex-1 animate-pulse rounded-xl bg-gray-200"></div>
      <div class="h-9 w-9 animate-pulse rounded-xl bg-gray-200"></div>
    </div>
  </div>
</div>
