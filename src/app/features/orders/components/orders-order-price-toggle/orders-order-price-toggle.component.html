<div class="flex items-center justify-between px-4 pb-4">
  <p class="text-lg font-bold text-gray-900">
    {{ totalPrice() }} <span class="text-xs font-normal text-gray-400">EGP</span>
  </p>
  <button
    (click)="onClick()"
    [class]="
      isOpen()
        ? 'bg-primary-500 hover:bg-primary-600 shadow-primary-300 text-white shadow-lg'
        : 'text-secondary-500 bg-gray-100 hover:bg-gray-200'
    "
    class="flex cursor-pointer items-center gap-2 rounded-xl px-5 py-3 text-sm font-medium transition-colors duration-300"
  >
    @if (isOpen()) {
      Hide
    } @else {
      Details
    }
    <i
      [class]="isOpen() ? 'rotate-0' : '-rotate-180'"
      class="fa-solid fa-chevron-up text-xs transition-transform duration-300"
    ></i>
  </button>
</div>
