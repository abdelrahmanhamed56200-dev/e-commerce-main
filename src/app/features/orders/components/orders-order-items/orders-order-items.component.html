<div class="border-t border-gray-100 px-4 py-4">
  <div class="mb-3 flex items-center gap-2">
    <span class="bg-primary-500 flex h-4 w-4 items-center justify-center rounded">
      <i class="fa-solid fa-check text-xs text-white"></i>
    </span>
    <span class="text-sm font-semibold text-gray-700">Order Items</span>
  </div>

  <div class="flex flex-col gap-3">
    @for (item of cartItems(); track item._id) {
      <app-order-item [cartItem]="item" />
    }
  </div>
</div>
