<div class="rounded-2xl border border-gray-200 bg-gray-100 shadow-md">
  <!-- Order Card Skeleton -->
  <div class="flex flex-col gap-5 p-4 sm:flex-row sm:items-center">
    <!-- Image -->
    <div
      class="h-20 w-20 shrink-0 animate-pulse self-center rounded-xl bg-gray-200 sm:self-auto"
    ></div>

    <div class="flex min-w-0 flex-1 flex-col gap-2">
      <!-- Status badge -->
      <div class="h-6 w-24 animate-pulse rounded-full bg-gray-200"></div>

      <!-- Order ID -->
      <div class="h-4 w-32 animate-pulse rounded-md bg-gray-300"></div>

      <!-- Date · Items · City -->
      <div class="flex flex-wrap gap-2">
        <div class="h-3 w-24 animate-pulse rounded-md bg-gray-200"></div>
        <div class="h-3 w-16 animate-pulse rounded-md bg-gray-200"></div>
        <div class="h-3 w-20 animate-pulse rounded-md bg-gray-200"></div>
      </div>
    </div>

    <!-- Payment icon -->
    <div
      class="h-9 w-9 shrink-0 animate-pulse self-start rounded-lg bg-gray-200 sm:self-auto"
    ></div>
  </div>

  <!-- Footer -->
  <div class="flex items-center justify-between px-4 pb-4">
    <div class="h-6 w-24 animate-pulse rounded-md bg-gray-300"></div>
    <div class="h-10 w-28 animate-pulse rounded-xl bg-gray-200"></div>
  </div>
</div>
