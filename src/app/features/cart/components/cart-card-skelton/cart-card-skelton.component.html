<!-- Cart Item Card Skeleton -->
<div
  class="flex flex-col gap-4 rounded-2xl border border-gray-100 p-4 shadow-sm sm:flex-row sm:items-center"
>
  <!-- Image + Badge -->
  <div class="relative flex shrink-0 flex-col items-center gap-2">
    <div class="h-24 w-full animate-pulse rounded-xl bg-gray-200 sm:w-24"></div>
    <div class="h-5 w-16 animate-pulse self-start rounded-full bg-gray-200"></div>
  </div>

  <!-- Info -->
  <div class="flex flex-1 flex-col gap-2">
    <!-- Title -->
    <div class="h-4 w-3/4 animate-pulse rounded-md bg-gray-300"></div>

    <!-- Category Badge -->
    <div class="h-6 w-28 animate-pulse rounded-full bg-gray-200"></div>

    <!-- Price -->
    <div class="h-4 w-24 animate-pulse rounded-md bg-gray-200"></div>

    <!-- Quantity + Total + Delete -->
    <div class="flex flex-wrap items-center justify-between gap-4">
      <!-- Quantity -->
      <div class="h-9 w-28 animate-pulse rounded-xl bg-gray-200"></div>

      <!-- Total + Delete -->
      <div class="flex items-center gap-3">
        <div class="flex flex-col items-end gap-1">
          <div class="h-3 w-8 animate-pulse rounded-md bg-gray-200"></div>
          <div class="h-5 w-16 animate-pulse rounded-md bg-gray-300"></div>
        </div>
        <div class="h-9 w-9 animate-pulse rounded-xl bg-gray-200"></div>
      </div>
    </div>
  </div>
</div>
