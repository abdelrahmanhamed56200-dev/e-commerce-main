<section class="flex justify-center py-16 text-center">
  <div class="lg:max-w-1/3">
    <div
      class="relative z-0 mx-auto mb-4 flex h-20 w-20 items-center justify-center rounded-full bg-gray-100"
    >
      <i class="fa-solid fa-box-open animate-pulse text-5xl text-gray-500"></i>
    </div>
    <h2 class="mb-4 text-2xl font-semibold text-gray-800">Your cart is empty</h2>
    <p class="mb-6 text-gray-500">
      Looks like you haven't added anything to your cart yet. Start exploring our products!
    </p>
    <div class="mx-auto flex flex-col items-stretch gap-2">
      <a
        routerLink="/products"
        class="group bg-primary-500 hover:bg-primary-600 inline-flex cursor-pointer items-center justify-center gap-2 rounded-xl px-6 py-3 text-sm font-semibold text-white shadow transition duration-300"
      >
        Start Shopping

        <i
          class="fa-solid fa-arrow-right-long text-sm transition duration-300 group-hover:translate-x-1"
        ></i>
      </a>
      @if (!isLogged()) {
        <a
          routerLink="/login"
          class="text-secondary-500 inline-flex cursor-pointer items-center justify-center gap-2 rounded-xl border border-gray-100 bg-gray-50 px-6 py-3 text-sm font-bold shadow transition duration-300 hover:bg-gray-100"
        >
          Sign In
        </a>
      }
    </div>
  </div>
</section>
