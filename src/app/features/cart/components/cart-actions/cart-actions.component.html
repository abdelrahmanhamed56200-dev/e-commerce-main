<div class="mt-4 flex justify-between border-t border-gray-100 py-4">
  <a
    routerLink="/products"
    class="group hover:text-primary-500 flex cursor-pointer items-center gap-2 text-[14px] font-semibold text-gray-500 transition"
  >
    <i
      class="fa-solid fa-arrow-left text-xs transition duration-300 group-hover:-translate-x-1"
    ></i>
    Continue Shopping
  </a>

  <button
    (click)="onFireSwal()"
    class="group flex cursor-pointer items-center gap-2 text-[14px] font-semibold text-gray-500 transition hover:text-red-500"
  >
    <i class="fa-solid fa-trash text-xs transition group-hover:scale-110"></i>
    Clear all items
  </button>
</div>
