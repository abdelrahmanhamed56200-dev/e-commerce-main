<section
  class="top-20 flex flex-col gap-3 rounded-2xl border border-gray-100 p-3 shadow-sm md:sticky"
>
  <!-- Main Image -->
  <div class="h-100 w-full animate-pulse rounded-2xl bg-gray-200"></div>

  <!-- Thumbs -->
  <div class="mx-auto flex w-full max-w-70 items-center justify-center gap-2">
    @for (item of [1, 2, 3]; track $index) {
      <div class="h-16 w-16 shrink-0 animate-pulse rounded-lg bg-gray-200"></div>
    }
  </div>
</section>
