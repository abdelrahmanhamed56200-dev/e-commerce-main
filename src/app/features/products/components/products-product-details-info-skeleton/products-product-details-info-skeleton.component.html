<section class="flex w-full flex-col gap-5 rounded-2xl border border-gray-100 p-6 shadow-sm">
  <!-- Badges -->
  <div class="flex items-center gap-2">
    <div class="h-6 w-28 animate-pulse rounded-full bg-gray-200"></div>
    <div class="h-6 w-20 animate-pulse rounded-full bg-gray-200"></div>
  </div>

  <!-- Title -->
  <div class="h-7 w-3/4 animate-pulse rounded-lg bg-gray-300"></div>

  <!-- Rating -->
  <div class="flex items-center gap-2">
    <div class="h-4 w-28 animate-pulse rounded-md bg-gray-200"></div>
    <div class="h-4 w-24 animate-pulse rounded-md bg-gray-200"></div>
  </div>

  <!-- Price -->
  <div class="h-7 w-32 animate-pulse rounded-lg bg-gray-300"></div>

  <!-- Stock Badge -->
  <div class="h-7 w-24 animate-pulse rounded-full bg-gray-200"></div>

  <!-- Divider -->
  <section class="flex flex-col gap-5 border-t border-gray-100 pt-5">
    <!-- Description -->
    <div class="flex flex-col gap-2">
      <div class="h-3 w-full animate-pulse rounded-md bg-gray-200"></div>
      <div class="h-3 w-5/6 animate-pulse rounded-md bg-gray-200"></div>
      <div class="h-3 w-4/6 animate-pulse rounded-md bg-gray-200"></div>
    </div>

    <!-- Quantity -->
    <div class="flex flex-col gap-2">
      <div class="h-4 w-20 animate-pulse rounded-md bg-gray-200"></div>
      <div class="flex items-center gap-4">
        <div class="h-10 w-32 animate-pulse rounded-lg bg-gray-200"></div>
        <div class="h-4 w-24 animate-pulse rounded-md bg-gray-200"></div>
      </div>
    </div>

    <!-- Total Price -->
    <div class="flex items-center justify-between rounded-xl bg-gray-50 px-5 py-3">
      <div class="h-4 w-20 animate-pulse rounded-md bg-gray-200"></div>
      <div class="h-5 w-28 animate-pulse rounded-md bg-gray-300"></div>
    </div>

    <!-- Add to Cart button -->
    <div class="h-12 w-full animate-pulse rounded-xl bg-gray-200"></div>

    <!-- Wishlist + Share -->
    <div class="flex gap-3">
      <div class="h-12 flex-1 animate-pulse rounded-xl bg-gray-200"></div>
      <div class="h-12 w-12 animate-pulse rounded-xl bg-gray-200"></div>
    </div>
  </section>

  <!-- Badges Footer -->
  <footer class="flex items-center justify-between pt-2">
    @for (item of [1, 2, 3]; track $index) {
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 animate-pulse rounded-full bg-gray-200"></div>
        <div class="flex flex-col gap-1">
          <div class="h-3 w-20 animate-pulse rounded-md bg-gray-300"></div>
          <div class="h-3 w-14 animate-pulse rounded-md bg-gray-200"></div>
        </div>
      </div>
    }
  </footer>
</section>
