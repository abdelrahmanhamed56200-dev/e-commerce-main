<section rou class="px-6 py-8">
  <div class="container">
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
      <!-- Card 1 -->
      <div
        #cart1
        class="from-primary-400 via-primary-500 to-primary-700 relative overflow-hidden rounded-2xl bg-linear-to-br p-8 opacity-0 shadow-sm"
      >
        <div class="absolute -top-8 -right-8 h-40 w-40 rounded-full bg-white/30 opacity-20"></div>
        <div
          class="absolute right-15 -bottom-5 h-24 w-24 rounded-full bg-white/30 opacity-10"
        ></div>
        <span
          class="mb-4 inline-flex items-center gap-1 rounded-full bg-white/20 px-3 py-1 text-xs font-semibold text-white"
        >
          <i class="fa-solid fa-fire text-xs text-orange-400"></i> Deal of the Day
        </span>
        <h3 class="mb-2 text-2xl font-extrabold text-white">Fresh Organic Fruits</h3>
        <p class="mb-3 text-sm text-white/80">Get up to 40% off on selected organic fruits</p>
        <p class="mb-6 text-xl font-extrabold text-white">
          40% OFF
          <span class="ml-1 text-xs font-semibold text-white/70">
            Use code: <strong class="text-white">ORGANIC40</strong>
          </span>
        </p>
        <a
          routerLink="/products"
          class="text-primary-700 inline-flex items-center gap-2 rounded-full bg-white px-6 py-2.5 text-sm font-semibold transition hover:bg-green-50"
        >
          Shop Now <i class="fa-solid fa-arrow-right text-xs"></i>
        </a>
      </div>

      <!-- Card 2 -->
      <div
        #cart2
        class="relative overflow-hidden rounded-2xl bg-linear-to-br from-[#f9a825] via-[#f4511e] to-[#e53935] p-8 opacity-0 shadow-sm"
      >
        <div class="absolute -top-8 -right-8 h-40 w-40 rounded-full bg-white/30 opacity-20"></div>
        <div
          class="absolute right-15 -bottom-5 h-24 w-24 rounded-full bg-white/30 opacity-10"
        ></div>
        <span
          class="mb-4 inline-flex items-center gap-1 rounded-full bg-white/20 px-3 py-1 text-xs font-semibold text-white"
        >
          <i class="fa-solid fa-star text-xs text-yellow-300"></i> New Arrivals
        </span>
        <h3 class="mb-2 text-2xl font-extrabold text-white">Exotic Vegetables</h3>
        <p class="mb-3 text-sm text-white/80">
          Discover our latest collection of premium vegetables
        </p>
        <p class="mb-6 text-xl font-extrabold text-white">
          25% OFF
          <span class="ml-1 text-xs font-semibold text-white/70">
            Use code: <strong class="text-white">FRESH25</strong>
          </span>
        </p>
        <a
          routerLink="/products"
          [queryParams]="{ sort: 'newest' }"
          class="inline-flex items-center gap-2 rounded-full bg-white px-6 py-2.5 text-sm font-semibold text-orange-600 transition hover:bg-orange-50"
        >
          Explore Now <i class="fa-solid fa-arrow-right text-xs"></i>
        </a>
      </div>
    </div>
  </div>
</section>
