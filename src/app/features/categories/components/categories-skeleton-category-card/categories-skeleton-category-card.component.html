<div
  class="container grid grid-cols-1 gap-4 px-6 py-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"
>
  @for (item of [1, 2, 3, 4, 5, 6, 7, 8]; track $index) {
    <div
      class="group flex flex-col items-center gap-3 rounded-2xl border border-gray-200 p-4 shadow-md"
    >
      <!-- Image Skeleton -->
      <div class="h-48 w-full animate-pulse overflow-hidden rounded-xl bg-gray-200"></div>

      <!-- Title Skeleton -->
      <div class="h-3 w-1/2 animate-pulse rounded bg-gray-200"></div>

      <!-- Subtitle Skeleton -->
      <div class="h-2 w-2/3 animate-pulse rounded bg-gray-200"></div>
    </div>
  }
</div>
