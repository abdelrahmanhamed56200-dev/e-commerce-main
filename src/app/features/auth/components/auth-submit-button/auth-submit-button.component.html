<button
  (click)="submit()"
  [class]="isLoading() ? 'bg-primary-700!' : ''"
  class="bg-primary-600 hover:bg-primary-700 flex w-full cursor-pointer items-center justify-center gap-1 rounded-xl py-3 font-semibold text-white transition duration-300"
>
  {{ text() }}
  @if (isLoading()) {
    <i class="fa-solid fa-spinner fa-spin"></i>
  }
</button>
