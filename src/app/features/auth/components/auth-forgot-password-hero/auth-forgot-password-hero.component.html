<section class="hidden lg:block">
  <!-- Illustration Card -->
  <div
    class="bg-primary-100/50 relative mx-auto flex aspect-square max-h-100 flex-col items-center justify-center overflow-hidden rounded-2xl p-10"
  >
    <!-- Decorative circles -->
    <div
      class="bg-primary-100 absolute top-6 left-8 h-20 w-20 animate-[bounce_3.1s_0.5s_ease-in-out_infinite] rounded-full opacity-60"
    ></div>
    <div class="bg-primary-200 absolute top-4 right-10 h-14 w-14 rounded-full opacity-40"></div>
    <div
      class="bg-primary-100 absolute right-11 bottom-11 h-24 w-24 animate-[bounce_3.7s_ease-in-out_infinite] rounded-full opacity-50"
    ></div>
    <div class="bg-primary-200 absolute bottom-10 left-4 h-10 w-10 rounded-full opacity-30"></div>

    <!-- Icons row -->
    <div class="relative mb-6 flex items-center justify-center gap-3">
      <!-- Email icon -->
      <div
        class="flex h-14 w-14 -rotate-6 items-center justify-center rounded-2xl bg-white shadow-md"
      >
        <i class="fa-solid fa-envelope text-primary-600 text-xl"></i>
      </div>

      <!-- Lock icon (center, larger) -->
      <div class="z-10 flex h-20 w-20 items-center justify-center rounded-2xl bg-white shadow-lg">
        <i class="fa-solid fa-lock text-primary-600 text-3xl"></i>
      </div>

      <!-- Shield icon -->
      <div
        class="flex h-14 w-14 rotate-6 items-center justify-center rounded-2xl bg-white shadow-md"
      >
        <i class="fa-solid fa-shield-halved text-primary-600 text-xl"></i>
      </div>
    </div>

    <!-- Dots -->
    <div class="flex items-center gap-2">
      <span class="bg-primary-400 h-3 w-3 animate-pulse rounded-full"></span>
      <span class="bg-primary-600 h-3 w-3 animate-pulse rounded-full"></span>
      <span class="bg-primary-800 h-3 w-3 animate-pulse rounded-full"></span>
    </div>
  </div>

  <!-- Text Content -->
  <div class="px-4 pt-6 text-center">
    <h2 class="text-secondary-900 mb-3 text-2xl font-bold">Reset Your Password</h2>
    <p class="text-secondary-500 mb-6 text-sm leading-relaxed">
      Don't worry, it happens to the best of us. We'll help you get back into your account in no
      time.
    </p>

    <!-- Feature badges -->
    <div class="flex flex-wrap items-center justify-center gap-6">
      <span class="text-secondary-600 flex items-center gap-1.5 text-sm">
        <i class="fa-solid fa-envelope text-primary-600"></i>
        Email Verification
      </span>

      <span class="text-secondary-600 flex items-center gap-1.5 text-sm">
        <i class="fa-solid fa-shield-halved text-primary-600"></i>
        Secure Reset
      </span>

      <span class="text-secondary-600 flex items-center gap-1.5 text-sm">
        <i class="fa-solid fa-lock text-primary-600"></i>
        Encrypted
      </span>
    </div>
  </div>
</section>
