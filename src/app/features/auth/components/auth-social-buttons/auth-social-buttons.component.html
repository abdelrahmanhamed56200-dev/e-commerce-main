<div [class]="disPlayLayout() === 'col' ? 'flex-col' : ''" class="flex gap-3">
  <button
    (click)="selectSocial('google')"
    class="text-secondary-600 hover:border-primary-300 hover:bg-primary-100/50 flex grow items-center justify-center gap-3 rounded-xl border border-gray-200 py-2.5 text-sm font-medium transition"
  >
    <i class="fa-brands fa-google text-base text-red-500"></i> Continue with Google
  </button>
  <button
    (click)="selectSocial('facebook')"
    class="text-secondary-600 hover:border-primary-300 hover:bg-primary-100/50 flex grow items-center justify-center gap-3 rounded-xl border border-gray-200 py-2.5 text-sm font-medium transition"
  >
    <i class="fa-brands fa-facebook text-base text-blue-600"></i> Continue with Facebook
  </button>
</div>
