<div
  [class]="colorMap[mainColor()].wrapper"
  class="flex items-start gap-4 rounded-2xl border p-6 shadow-sm"
>
  <div [class]="colorMap[mainColor()].icon" class="rounded-xl p-3 text-white shadow">
    <i [class]="icon()"></i>
  </div>

  <div>
    <h2 class="text-secondary-900 mb-1 text-lg font-bold">
      {{ title() }}
    </h2>
    <p class="text-secondary-700 text-sm leading-relaxed font-medium">
      {{ text() }}
    </p>
  </div>
</div>
