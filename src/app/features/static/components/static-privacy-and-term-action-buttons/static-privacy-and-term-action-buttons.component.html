<div class="flex flex-col gap-3 border-t border-gray-200 p-5 md:flex-row md:justify-between">
  <!-- Left Button -->
  <a
    routerLink="/"
    class="group text-secondary-600 flex w-full items-center justify-center gap-2 rounded-xl bg-gray-100 px-4 py-2 transition hover:bg-gray-200 md:w-auto md:justify-start"
  >
    <i class="fa-solid fa-arrow-left transition duration-300 group-hover:-translate-x-1"></i>
    Back to Home
  </a>

  <!-- Right Button -->
  <a
    [routerLink]="paths()"
    class="group bg-primary-500 hover:bg-primary-600 flex w-full items-center justify-center gap-2 rounded-xl px-4 py-2 font-medium text-white transition md:w-auto md:justify-end"
  >
    {{ pathName() }}
    <i class="fa-solid fa-arrow-right transition duration-300 group-hover:translate-x-1"></i>
  </a>
</div>
