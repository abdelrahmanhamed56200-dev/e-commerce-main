<button
  (click)="click()"
  [class]="
    activeId() === address()._id
      ? 'border-primary-500 shadow-primary-100 bg-primary-100 border-2 shadow-lg'
      : 'hover:border-primary-300 border bg-gray-50'
  "
  class="flex w-full cursor-pointer items-start gap-3 rounded-xl border-gray-200 p-4 transition duration-300"
>
  <!-- icon -->
  <span
    [class]="
      activeId() === address()._id ? 'bg-primary-500 text-white' : 'bg-gray-200 text-gray-600'
    "
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded text-lg transition duration-300"
  >
    @if (activeId() === address()._id) {
      <i class="fa-solid fa-check"></i>
    } @else {
      <i class="fa-solid fa-location-dot"></i>
    }
  </span>

  <div class="flex flex-col items-start gap-1">
    <!-- name -->
    <p
      [class]="activeId() === address()._id ? 'text-primary-600' : 'text-secondary-700'"
      class="font-bold transition duration-300"
    >
      {{ address().name }}
    </p>

    <!-- details -->
    <p class="text-secondary-400 text-sm">{{ address().details }}</p>

    <div class="mt-1 flex items-center gap-3">
      <!-- phone -->
      <span class="text-secondary-400 flex items-center gap-1 text-xs">
        <i class="fa-solid fa-phone text-xs"></i>{{ address().phone }}
      </span>

      <!-- city -->
      <span class="text-secondary-400 flex items-center gap-1 text-xs">
        <i class="fa-solid fa-building text-xs"></i> {{ address().city }}
      </span>
    </div>
  </div>
</button>
