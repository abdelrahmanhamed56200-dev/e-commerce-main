<div class="flex items-center gap-3 rounded-xl border border-gray-200 bg-gray-100 p-3">
  <div class="h-14 w-14 shrink-0 overflow-hidden rounded-lg border border-gray-100">
    <img
      [src]="cartItem().product.imageCover"
      [alt]="cartItem().product.title"
      class="h-full w-full object-cover"
    />
  </div>
  <div class="min-w-0 flex-1">
    <p class="text-secondary-800 font-medium">{{ cartItem().product.title }}</p>
    <p class="text-secondary-400 text-sm font-medium">
      {{ cartItem().count }} × {{ cartItem().price }} EGP
    </p>
  </div>
  <div class="shrink-0 text-right">
    <p class="text-secondary-800 text-lg font-bold">{{ cartItem().price * cartItem().count }}</p>
    <p class="text-secondary-400">EGP</p>
  </div>
</div>
