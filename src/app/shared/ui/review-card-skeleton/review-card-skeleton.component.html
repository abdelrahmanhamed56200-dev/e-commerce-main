<!-- Review Card Skeleton -->
<div class="rounded-2xl border border-gray-100 p-5 shadow-sm">
  <!-- Header -->
  <div class="mb-3 flex items-start justify-between">
    <div class="flex flex-col gap-2">
      <!-- Name -->
      <div class="h-4 w-32 animate-pulse rounded-md bg-gray-300"></div>
      <!-- Date -->
      <div class="h-3 w-20 animate-pulse rounded-md bg-gray-200"></div>
    </div>

    <!-- Stars -->
    <div class="flex items-center gap-1">
      <div class="h-4 w-24 animate-pulse rounded-md bg-gray-200"></div>
    </div>
  </div>

  <!-- Review Text -->
  <div class="flex flex-col gap-2">
    <div class="h-3 w-full animate-pulse rounded-md bg-gray-200"></div>
    <div class="h-3 w-5/6 animate-pulse rounded-md bg-gray-200"></div>
    <div class="h-3 w-4/6 animate-pulse rounded-md bg-gray-200"></div>
  </div>
</div>
