@if (isShow()) {
  <section>
    <div class="flex flex-wrap items-center gap-2">
      <!-- Filter Icon + Label -->
      <span class="flex items-center gap-1 text-[14px] text-gray-500">
        <i class="fa-solid fa-filter text-xs"></i> Active:
      </span>

      @for (filter of filters(); track $index) {
        <span
          [class]="filterClass[filter.type]"
          class="flex items-center gap-1 rounded-full px-3 py-1 text-[14px] font-medium"
        >
          {{ filter.value }}
          <button
            (click)="removeFilter(filter)"
            class="cursor-pointer transition duration-300 hover:text-red-500"
          >
            <i class="fa-solid fa-xmark text-xs"></i>
          </button>
        </span>
      }

      <!-- Clear All -->
      <button
        (click)="clearFilters()"
        class="text-primary-500 hover:text-primary-600 hover:bg-primary-100 ml-1 cursor-pointer rounded-full px-3 py-1 text-sm font-medium underline transition"
      >
        Clear all
      </button>
    </div>
  </section>
}
