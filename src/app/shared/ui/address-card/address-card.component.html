<div
  class="group flex h-full gap-3 rounded-xl border border-gray-100 bg-white p-5 shadow-sm transition duration-300 hover:shadow-md"
>
  <div
    class="bg-primary-100 text-primary-500 group-hover:bg-primary-200/80 flex h-9 w-9 shrink-0 items-center justify-center rounded-sm transition duration-300"
  >
    <i class="fa-solid fa-location-dot"></i>
  </div>

  <div class="min-w-0 grow">
    <div class="flex justify-between gap-3">
      <h4 class="text-secondary-500 overflow-hidden text-lg font-semibold text-clip">
        {{ address().name }}
      </h4>

      <div class="flex gap-3 self-start text-sm text-gray-500">
        <button
          (click)="onEdit()"
          class="hover:bg-primary-100 hover:text-primary-500 flex h-8 w-8 cursor-pointer items-center justify-center rounded bg-gray-100 transition duration-300"
        >
          <i class="fa-solid fa-pen-to-square"></i>
        </button>
        <button
          (click)="onDelete()"
          class="flex h-8 w-8 cursor-pointer items-center justify-center rounded bg-gray-100 transition duration-300 hover:bg-red-100 hover:text-red-500"
        >
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    </div>

    <p class="mb-4 w-full overflow-hidden text-sm text-clip text-gray-500">
      {{ address().details }}
    </p>

    <div class="text-secondary-400 flex flex-wrap gap-3 text-sm font-medium">
      <p class="flex items-center gap-2">
        <i class="fa-solid fa-phone"></i>
        {{ address().phone }}
      </p>

      <p class="flex items-center gap-2 overflow-hidden text-clip">
        <i class="fa-solid fa-city"></i>
        {{ address().city }}
      </p>
    </div>
  </div>
</div>
