@if (isVisible()) {
  <div class="fixed inset-0 z-55">
    <!-- overlay -->
    <div
      (click)="onClose()"
      class="absolute inset-0 bg-black/50 backdrop-blur-xs transition-opacity duration-800"
      [class.opacity-100]="isOpen()"
      [class.opacity-0]="!isOpen()"
    ></div>

    <!-- modal -->
    <div
      class="absolute top-1/2 left-1/2 z-56 w-4/5 -translate-x-1/2 -translate-y-1/2 rounded-2xl bg-white p-5 shadow-2xl transition-all duration-700 ease-in-out md:w-1/2"
      [class.scale-100]="isOpen()"
      [class.scale-95]="!isOpen()"
      [class.opacity-100]="isOpen()"
      [class.opacity-0]="!isOpen()"
    >
      <div class="mb-5 flex items-center justify-between">
        <h2 class="text-secondary-600 text-lg font-semibold">
          @if (moduleType() === 'edit') {
            Edit Address
          } @else {
            Add New Address
          }
        </h2>
        <button
          (click)="onClose()"
          class="text-secondary-400 flex h-8 w-8 cursor-pointer items-center justify-center rounded-full hover:bg-red-100 hover:text-red-500"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form [formGroup]="addressForm" class="flex flex-col gap-5">
        <!-- name -->
        <app-address-modal-input
          inputType="text"
          formControlName="name"
          label="Address Name"
          inputId="name"
          [control]="addressForm.get('name')"
          [errors]="[
            { error: 'required', message: '*Address is required' },
            { error: 'minLength', message: '*Minimum 2 characters required' },
            { error: 'validName', message: '*Only letters and valid format allowed' },
          ]"
        />

        <app-address-modal-input
          inputType="textarea"
          formControlName="details"
          label="Full Address"
          inputId="details"
          [control]="addressForm.get('details')"
          [errors]="[
            { error: 'required', message: '*Details is required' },
            { error: 'minlength', message: '*Minimum 5 characters required' },
            { error: 'pattern', message: '*Invalid details format' },
          ]"
        />

        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <!-- phone -->
          <app-address-modal-input
            inputType="text"
            formControlName="phone"
            label="Phone Number"
            inputId="phone"
            [control]="addressForm.get('phone')"
            [errors]="[
              { error: 'required', message: '*Please enter your phone number' },
              { error: 'egyptPhone', message: '*Only Egyptian phone numbers are allowed' },
            ]"
          />

          <!-- city -->
          <app-address-modal-input
            inputType="text"
            formControlName="city"
            label="City"
            inputId="city"
            [control]="addressForm.get('city')"
            [errors]="[
              { error: 'required', message: '*City is required' },
              { error: 'minlength', message: '*Minimum 2 characters required' },
              { error: 'maxlength', message: '*Maximum 50 characters allowed' },
              { error: 'pattern', message: '*Only letters, spaces and hyphens allowed' },
            ]"
          />
        </div>

        <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
          <button
            (click)="onClose()"
            type="button"
            class="text-secondary-500 cursor-pointer rounded-xl bg-gray-100 p-3 text-center font-semibold transition duration-300 hover:bg-gray-200"
          >
            cancel
          </button>
          <button
            type="submit"
            [class.bg-primary-700]="isLoading()"
            (click)="onSubmit()"
            class="bg-primary-500 hover:bg-primary-600 cursor-pointer rounded-xl p-3 text-center font-semibold text-white transition duration-300"
          >
            @if (moduleType() === 'edit') {
              Edit Address
            } @else {
              Add New Address
            }
            @if (isLoading()) {
              <i class="fa-solid fa-spinner fa-spin"></i>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}
